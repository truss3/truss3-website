name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送自动取消进行中的旧构建，节省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # turborepo 在 CI 中强制使用非交互式日志，避免 TUI 输出乱码
  TURBO_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  quality:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          # 从仓库根的 .node-version 读取，保证本地与 CI 版本严格一致
          node-version-file: .node-version
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码格式检查
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建
        run: pnpm build
        env:
          SITE_URL: https://example.com

      - name: 上传构建产物（便于排查失败原因）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: apps/*/dist
          if-no-files-found: ignore
          retention-days: 7
