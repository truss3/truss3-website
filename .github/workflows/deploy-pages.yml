name: Deploy to GitHub Pages

# 仅 main 分支推送或手动触发时部署
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # 读取仓库 Pages 设置，自动推导站点地址与 base 路径。
      # 在 Settings -> Pages 绑定自定义域名后，此步骤会自动切换到该域名，
      # 无需改动任何代码或工作流。
      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建站点
        run: pnpm build
        env:
          # 优先使用显式配置的自定义域名，避免首次部署时 Pages 设置尚未生效
          # 导致 canonical / sitemap 生成 github.io 或错误的子路径地址。
          SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || steps.pages.outputs.origin }}
          # 绑定独立域名后站点位于根路径；未绑定时沿用 Pages 推导出的子路径。
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN != '' && '/' || steps.pages.outputs.base_path }}

      # 显式写入 CNAME，保证自定义域名在每次部署后都被保留
      - name: 写入 CNAME（已绑定自定义域名时）
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > apps/conversation-web/dist/CNAME

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/conversation-web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
